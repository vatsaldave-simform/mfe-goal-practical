schema: spec-driven

context: |
  # MFE E-Commerce Learning Platform

  ## Domain
  E-commerce application built as microfrontends for learning purposes.
  Developed entirely by AI using OpenSpec workflow.

  ## Tech Stack
  - Monorepo: Turborepo + pnpm workspaces
  - Bundler: Rsbuild
  - Runtime Integration: Module Federation v2 (@module-federation/rsbuild-plugin)
  - Language: TypeScript (strict)
  - UI Framework: React 19
  - Routing: React Router v7 (host owns BrowserRouter, MFEs use relative routes)
  - State Management: Zustand (shared singleton via MF shared config)
  - Server State: TanStack Query (React Query)
  - Form Handling: React Hook Form + Zod
  - Styling: Tailwind CSS v4 (CSS-first @theme config)
  - Component Library: shadcn/ui (in shared packages/ui)
  - Backend: Express (minimal, in-memory data store)
  - Package scope: @mfe/*

